name: CI

on:
  pull_request:

# contents/pull-requests: write are the translator flow's: the text check
# explains itself on the pull request and merges a text-only change by itself.
permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/package-ci.yml@v1.10.0

  texts:
    uses: museumwithnofrontiers/viewer-workflows/.github/workflows/locale-validate.yml@v1.10.0
    with:
      mode: dictionary
      texts_path: "core/ layout/ catalogue/ sheet/ record/ gallery/ exhibition/"
